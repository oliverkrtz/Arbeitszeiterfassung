name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: iOS-Build (ohne Signierung)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Neuestes Xcode wählen
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          echo "Verwende: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: App bauen
        run: |
          xcodebuild build \
            -project Arbeitszeiterfassung.xcodeproj \
            -scheme Arbeitszeiterfassung \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
